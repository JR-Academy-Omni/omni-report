<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1242, initial-scale=1" />
  <title>澳洲黑五学习羊毛</title>
  <style>
    :root{--red:#ff5757;--ink:#10162f;--yellow:#ffde59;--green:#7ed957;--blue:#38b6ff;--purple:#cb6ce6;--paper:#fff1e7;--white:#fffdf7}
    *{box-sizing:border-box} html,body{margin:0;width:1242px;height:1660px;overflow:hidden;background:var(--paper)}
    body{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);font-weight:700}
    .slide{position:relative;width:1242px;height:1660px;padding:84px 76px 72px;overflow:hidden;background:var(--paper)}
    .texture{position:absolute;inset:0;background:url('collage-bg.jpg') center/cover no-repeat;opacity:.12;mix-blend-mode:multiply;pointer-events:none}
    .topline{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;font-size:25px;letter-spacing:1px}
    .brand{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:10px 18px;border:3px solid #000;box-shadow:5px 5px 0 #000}
    .brand img{height:29px;width:auto;filter:brightness(0) invert(1)}
    .page{background:var(--yellow);border:3px solid #000;padding:8px 15px;box-shadow:4px 4px 0 #000}
    h1,h2,p{margin:0}.hero{padding-top:38px}.hero h1{position:relative;font-size:122px;line-height:1.03;letter-spacing:-6px;max-width:1020px}
    .hero h1 .red{color:var(--red);text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
    .hero h1 .marker{display:inline-block;background:linear-gradient(transparent 58%,var(--yellow) 58%);transform:rotate(-1deg)}
    .hero .sub{font-size:42px;margin-top:36px;border-left:14px solid var(--blue);padding-left:20px;line-height:1.45}
    .hero .burst{position:absolute;right:72px;bottom:430px;width:285px;height:285px;background:var(--red);color:#fff;border:4px solid #000;clip-path:polygon(50% 0,61% 17%,79% 7%,82% 28%,100% 31%,87% 49%,100% 64%,79% 70%,81% 92%,61% 82%,50% 100%,39% 82%,20% 92%,22% 70%,0 64%,13% 49%,0 31%,18% 28%,21% 7%,39% 17%);display:flex;align-items:center;justify-content:center;text-align:center;font-size:40px;line-height:1.16;transform:rotate(8deg);text-shadow:2px 2px 0 #000}
    .hero .note{position:absolute;left:78px;bottom:180px;width:565px;padding:33px 40px;background:var(--yellow);border:4px solid #000;box-shadow:12px 12px 0 #000;transform:rotate(-3deg);font-size:38px;line-height:1.5}
    .hero .note:before{content:"";position:absolute;top:-21px;left:192px;width:160px;height:38px;background:rgba(255,255,255,.74);border:2px solid #000;transform:rotate(4deg)}
    .section-title{position:relative;font-size:66px;line-height:1.1;margin:20px 0 34px;letter-spacing:-2px}.section-title span{background:var(--yellow);padding:0 10px;border-bottom:6px solid #000}
    .kicker{font-size:27px;color:#fff;background:var(--red);display:inline-block;padding:9px 16px;border:3px solid #000;box-shadow:4px 4px 0 #000;transform:rotate(-1deg)}
    .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:25px}
    .card{position:relative;background:var(--white);border:4px solid #000;box-shadow:8px 8px 0 #000;padding:25px 25px 23px;min-height:190px}
    .card:nth-child(4n+2){background:#fff8c9}.card:nth-child(4n+3){background:#eaf7ff}.card:nth-child(4n){background:#f3e8ff}
    .name{font-size:31px;line-height:1.24;margin-bottom:17px}.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.old{font-size:25px;text-decoration:line-through;color:#646b7d}.new{font-size:40px;color:var(--red);font-weight:900}.save{font-size:20px;background:var(--green);border:2px solid #000;padding:3px 8px}
    .mini{font-size:22px;line-height:1.42;color:#454b5c;margin-top:12px}.num{position:absolute;top:-14px;right:16px;background:var(--yellow);border:3px solid #000;padding:4px 10px;font-size:20px;transform:rotate(3deg)}
    .platform-grid .card{min-height:273px;padding:29px}.platform-grid .name{font-size:38px}.deal{font-size:39px;color:var(--red);line-height:1.18;margin:12px 0}.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{font-size:20px;background:var(--blue);border:2px solid #000;padding:5px 9px}.tag.yellow{background:var(--yellow)}.tag.green{background:var(--green)}
    .student .card{min-height:225px}.student .name{font-size:36px}.student .deal{font-size:34px}.student .wide{grid-column:1/3;min-height:208px}
    .bottom-note{position:absolute;left:76px;right:76px;bottom:65px;background:var(--ink);color:#fff;border:4px solid #000;box-shadow:8px 8px 0 var(--red);padding:20px 28px;font-size:24px;line-height:1.45}
    .choice{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:25px}.choice .card{min-height:206px}.choice .question{font-size:28px;background:var(--yellow);display:inline-block;padding:5px 10px;border:2px solid #000;margin-bottom:14px}.choice .answer{font-size:34px;line-height:1.25}.choice .full{grid-column:1/3;background:#fff;padding:28px 32px}.trial{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-bottom:28px}.trial .card{min-height:235px}.cta{position:absolute;left:76px;right:76px;bottom:67px;background:var(--red);color:#fff;border:4px solid #000;box-shadow:10px 10px 0 #000;padding:25px 30px;font-size:29px;text-align:center;line-height:1.4}
    .scribble{position:absolute;border:7px solid var(--purple);border-radius:50%;width:270px;height:95px;transform:rotate(-8deg)}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const logo='../../../../../../jr-academy-brand/assets/logo/logo-official-black.svg';
const jr1=[
 ['AI Engineer 训练营','A$4,180','A$3,024','省 A$1,156'],
 ['AI Web 全栈项目班','A$4,999','A$3,679','省 A$1,320'],
 ['数据工程 AI 项目陪跑班','A$3,999','A$2,879','省 A$1,120'],
 ['DevOps AI 项目陪跑班','A$3,550','A$2,520','省 A$1,030'],
 ['Vibe Coding 提升班','A$770','A$376','省 A$394'],
 ['AI 一人创业营','A$3,800','A$2,720','省 A$1,080']
];
const jr2=[
 ['AI Adoption 自动化办公课','A$1,099','A$559','省 A$540'],
 ['AI 产品经理','A$4,400','A$3,200','省 A$1,200'],
 ['AI Engineer 进阶视频课','A$1,999','A$1,279','省 A$720'],
 ['AI 漫剧实战视频课','A$399','A$199','省 A$200'],
 ['Roy AI Engineer Workshop','A$389','A$191','省 A$198'],
 ['AI Engineer 入门视频课','A$299','A$119','省 A$180'],
 ['Ray AI Marketing 实战课','A$599','A$239','省 A$360']
];
const topbar=(n)=>`<div class="topline"><div class="brand">JR ACADEMY · 澳洲匠人学院</div><div class="page">${n}/6</div></div>`;
const bg='<div class="texture"></div>';
const jrCards=(arr,offset=0)=>arr.map((x,i)=>`<div class="card"><div class="num">01-${i+1+offset}</div><div class="name">${x[0]}</div><div class="price"><span class="old">${x[1]}</span><span class="new">${x[2]}</span><span class="save">${x[3]}</span></div></div>`).join('');
const slides=[
 `<section class="slide hero">${bg}${topbar(1)}<h1>澳洲黑五<br><span class="red">杀疯了！</span><br><span class="marker">12个留子学习</span><br>羊毛快薅！</h1><p class="sub">课程 · 证书 · 学生会员<br>一次帮你把省钱入口捋清</p><div class="burst">最高省<br>A$1,320</div><div class="note">先收藏，再按目标下单！<br><b>第 1 个就是 JR 黑五价</b></div></section>`,
 `<section class="slide">${bg}${topbar(2)}<div class="kicker">优惠 01 · JR Academy</div><h2 class="section-title">先看这波 <span>大羊毛</span></h2><div class="grid">${jrCards(jr1)}</div><div class="bottom-note">13 门已确认活动价｜这一页先放降得最猛的 6 门，下一页继续。</div></section>`,
 `<section class="slide">${bg}${topbar(3)}<div class="kicker">优惠 01 · JR Academy</div><h2 class="section-title">低门槛课也在 <span>狠降</span></h2><div class="grid">${jrCards(jr2,6)}</div><div class="bottom-note">想补 AI 项目、自动化办公、产品、营销或 Vibe Coding，都能按目标挑。</div></section>`,
 `<section class="slide">${bg}${topbar(4)}<div class="kicker">优惠 02—05 · 平台课</div><h2 class="section-title">平台课别再 <span>原价买</span></h2><div class="grid platform-grid">
  <div class="card"><div class="num">02</div><div class="name">Coursera Plus</div><div class="deal">年费 8 折</div><div class="mini">12 月 2 日截止｜10,000+ 课程、项目及部分 Professional Certificate</div><div class="tagrow"><span class="tag yellow">系统进阶</span><span class="tag">证书项目</span></div></div>
  <div class="card"><div class="num">03</div><div class="name">DataCamp Premium</div><div class="deal">US$330 → US$165</div><div class="mini">首年 5 折｜800+ AI、Python、SQL、Power BI 课程及项目</div><div class="tagrow"><span class="tag green">数据人必看</span></div></div>
  <div class="card"><div class="num">04</div><div class="name">Udemy</div><div class="deal">黑五专题已上线</div><div class="mini">AI、Python、Excel、认证备考都有；不同账号价格可能不同，只看自己的结账页。</div></div>
  <div class="card"><div class="num">05</div><div class="name">DataCamp Student</div><div class="deal">年费 5 折 / 月费 7 折</div><div class="mini">澳洲在读大学生可用学校邮箱验证｜学生价不可叠加其他促销</div><div class="tagrow"><span class="tag yellow">学生专享</span></div></div>
 </div><div class="bottom-note">优先顺序：先查学生价 → 再比黑五价 → 最后看是否会自动续费。</div></section>`,
 `<section class="slide student">${bg}${topbar(5)}<div class="kicker">优惠 06—10 · GitHub 学生包</div><h2 class="section-title">学生身份＝<span>白捡半年</span></h2><div class="grid">
  <div class="card wide"><div class="num">06</div><div class="name">DataCamp × GitHub Student Pack</div><div class="deal">3 个月免费</div><div class="mini">新用户 / 当前非订阅用户｜不绑信用卡｜每人一次</div></div>
  <div class="card"><div class="num">07</div><div class="name">Educative</div><div class="deal">6 个月免费</div><div class="mini">70+ 课程，另有订阅 7 折</div></div>
  <div class="card"><div class="num">08</div><div class="name">Frontend Masters</div><div class="deal">全站 6 个月免费</div><div class="mini">适合前端、JS、Node.js</div></div>
  <div class="card"><div class="num">09</div><div class="name">Boot.dev</div><div class="deal">完整会员 3 个月免费</div><div class="mini">后端、Python、Go、DevOps</div></div>
  <div class="card"><div class="num">10</div><div class="name">Codédex Club</div><div class="deal">高级会员 6 个月免费</div><div class="mini">Python、Web、React、Git 入门</div></div>
 </div><div class="bottom-note">领取入口：GitHub Student Developer Pack｜先完成学生资格认证。</div></section>`,
 `<section class="slide">${bg}${topbar(6)}<div class="kicker">优惠 11—12 · 先试再买</div><h2 class="section-title">不会选？<span>照着抄作业</span></h2><div class="trial">
  <div class="card"><div class="num">11</div><div class="name">O’Reilly Learning</div><div class="deal">免费试用 10 天</div><div class="mini">不用绑信用卡｜技术书、视频课、Live Events、互动实验</div></div>
  <div class="card"><div class="num">12</div><div class="name">LinkedIn Learning</div><div class="deal">符合资格可试用 1 个月</div><div class="mini">26,000+ 课程｜到期自动转付费，开通当天设提醒</div></div>
 </div><div class="choice">
  <div class="card"><div class="question">想跟中文老师做项目？</div><div class="answer">选 JR Academy</div></div>
  <div class="card"><div class="question">想学大厂课 / 证书项目？</div><div class="answer">选 Coursera</div></div>
  <div class="card"><div class="question">想补 AI / Python / SQL？</div><div class="answer">选 DataCamp</div></div>
  <div class="card"><div class="question">有 GitHub 学生包？</div><div class="answer">先把 4 个免费平台全领了</div></div>
 </div><div class="cta">你最想补哪项技能？评论区留「AI / 数据 / 前端 / 求职」</div></section>`
];
const n=Math.max(1,Math.min(6,Number(new URLSearchParams(location.search).get('slide')||1)));
document.getElementById('app').innerHTML=slides[n-1];
</script>
</body>
</html>
